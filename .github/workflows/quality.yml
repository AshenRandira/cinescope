name: Quality gates

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, build, E2E, and emulators
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Functions dependencies
        run: npm ci --prefix functions

      - name: Run unit tests
        run: npm test

      - name: Run Functions contract tests
        run: npm run test:functions

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Run accessibility-aware lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Build Firebase Functions
        run: npm run build:functions

      - name: Verify the browser TMDB security boundary
        run: npm run check:client-security

      - name: Enforce initial bundle budget
        run: npm run check:bundle

      - name: Validate V1 release foundation
        run: npm run check:release

      - name: Validate Firebase Hosting policy
        run: npm run check:hosting

      - name: Exercise Firebase Hosting responses
        run: npm run test:hosting

      - name: Exercise the Hosting to Functions API boundary
        run: npm run test:api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser journeys
        run: npm run test:e2e

      - name: Run Firebase emulator quality gate
        run: npm run test:emulators

      - name: Preserve Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
