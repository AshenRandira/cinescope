name: Quality gates

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.log

      - name: Report dependency install failure
        if: ${{ failure() && steps.install.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo '### npm ci failure'
            echo '```text'
            tail -n 80 npm-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          details="$(head -n 50 npm-ci.log)"
          details="${details//%/%25}"
          details="${details//$'\r'/%0D}"
          details="${details//$'\n'/%0A}"
          echo "::error file=package-lock.json,line=1,title=npm ci failure::$details"

      - name: Run unit tests
        run: npm test

      - name: Run accessibility-aware lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Enforce initial bundle budget
        run: npm run check:bundle
