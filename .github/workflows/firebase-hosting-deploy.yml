name: Firebase Hosting deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected Firebase environment to deploy
        required: true
        type: choice
        options:
          - preview
          - production
      confirmation:
        description: Enter DEPLOY PREVIEW or DEPLOY PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce explicit confirmation and production branch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOYMENT_TARGET: ${{ inputs.target }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          expected="DEPLOY ${DEPLOYMENT_TARGET^^}"

          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "Expected confirmation: $expected"
            exit 1
          fi

          if [[ "$DEPLOYMENT_TARGET" == "production" && "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "Production deployments are restricted to refs/heads/main."
            exit 1
          fi

  deploy:
    name: Deploy Firebase Hosting ${{ inputs.target }}
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: firebase-${{ inputs.target }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Run accessibility-aware lint
        run: npm run lint

      - name: Exercise local Hosting policy
        run: npm run test:hosting

      - name: Build selected environment
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_TMDB_READ_ACCESS_TOKEN: ${{ secrets.VITE_TMDB_READ_ACCESS_TOKEN }}
        run: npm run build:${{ inputs.target }}

      - name: Enforce bundle budget
        run: npm run check:bundle

      - name: Validate Hosting configuration
        run: npm run check:hosting

      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Deploy expiring preview channel
        if: inputs.target == 'preview'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: >-
          npx firebase-tools hosting:channel:deploy manual-${{ github.run_number }}
          --expires 7d
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive

      - name: Deploy protected live channel
        if: inputs.target == 'production'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: >-
          npx firebase-tools deploy
          --only hosting
          --project "$FIREBASE_PROJECT_ID"
          --message "GitHub Actions ${GITHUB_SHA}"
          --non-interactive
